[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[project]
name = "plate-lift-control"
version = "0.2.0"
description = "USB control of a two-position calibration plate lift with a Pololu Tic T825"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = "MIT"
authors = [{ name = "dainakai" }]
dependencies = ["filelock>=3.19,<4", "platformdirs>=4.3,<5", "pyyaml>=6.0,<7"]

[project.urls]
Repository = "https://github.com/dainakai/plate-lift-control"
Issues = "https://github.com/dainakai/plate-lift-control/issues"

[project.scripts]
platectl = "random_dot_plate_lift.cli:main"

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<0.14"]

[tool.uv.build-backend]
module-name = "random_dot_plate_lift"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
